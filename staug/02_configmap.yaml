# Non-secret configuration shared by every service.
# Anything sensitive (passwords, app keys, S3 credentials) lives in the
# Secret manifest — see `secrets.example.yaml`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: staug-config
  namespace: staug
data:
  # ── Common ────────────────────────────────────────────────────────
  APP_NAME: "STAUG"
  APP_ENV: "production"
  APP_DEBUG: "false"
  # The three URLs below must match the public hostnames the operator
  # exposes via the Ingress (see `ingress.yaml`). Adjust per environment
  # in the matching overlay.
  APP_URL: "http://10.0.0.80:31001"
  APP_FRONTEND_URL: "http://10.0.0.80:31000"

  # ── Database ──────────────────────────────────────────────────────
  DB_CONNECTION: "pgsql"
  DB_HOST: "10.0.0.80"
  DB_PORT: "31006"
  DB_DATABASE: "staug_db"

  # ── Redis ─────────────────────────────────────────────────────────
  REDIS_HOST: "10.0.0.80"
  REDIS_PORT: "31005"
  CACHE_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"

  # ── Object storage (MinIO) ────────────────────────────────────────
  FILESYSTEM_DISK: "minio"
  MINIO_PORT: "31003"
  MINIO_CONSOLE_PORT: "31004"
  MINIO_ENDPOINT: "http://10.0.0.80:31003"
  MINIO_BUCKET: "staugbkt"
  MINIO_REGION: "us-east-1"
  SONG_SHEET_URL_TTL: "30"

  # ── Upload caps (MB) ──────────────────────────────────────────────
  UPLOAD_IMPORT_MAX_MB: "100"
  UPLOAD_SHEET_MAX_MB: "10"

  # ── Mail (override per env; defaults to log driver) ───────────────
  MAIL_MAILER: "smtp"
  MAIL_FROM_ADDRESS: "saintaugustin@suuynyuy.com"
  MAIL_FROM_NAME: "SaintAugustin"

  # ── Projection service ────────────────────────────────────────────
  NODE_ENV: "production"
  PROJECTION_PORT: "3000"
  PROJECTION_URL: "http://10.0.0.80:31002"
  WS_URL: "ws://10.0.0.80:31002/ws"
