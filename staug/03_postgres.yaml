# PostgreSQL 16, single replica. StatefulSet so the PVC binding is
# stable across pod recreations. Fronted by a headless Service so the
# auth-service resolves `postgres` to the pod IP.
# Headless Service for the StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: staug
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 31006

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-pv
  namespace: staug
  labels:
    app: postgres
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/data/staug/postgres
    type: DirectoryOrCreate
  claimRef:
    namespace: staug
    name: data-postgres-0
  # If your cluster has more than one node, uncomment and set the node
  # where the data lives. hostPath is node-local; without this the pod
  # could be scheduled to a node that does not have the directory.
  # nodeAffinity:
  #   required:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #           - key: kubernetes.io/hostname
  #             operator: In
  #             values: ["your-node-name"]

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: staug
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staug-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: staug-config
                  key: DB_DATABASE
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual 
        resources:
          requests:
            storage: 5Gi