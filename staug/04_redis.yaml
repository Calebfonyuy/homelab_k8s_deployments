# Redis 7. Cache, queue, session store (auth-service) AND projection
# session state (projection-service). Single replica with a small PVC
# so cached sessions survive pod restarts — projection state is
# regenerated on session create, so a wipe is non-fatal.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: staug
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 31005

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-pv
  namespace: staug
  labels:
    app: redis
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/data/staug/redis
    type: DirectoryOrCreate
  claimRef:
    namespace: staug
    name: redis-data
  # If your cluster has more than one node, uncomment and set the node
  # where the data lives. hostPath is node-local; without this the pod
  # could be scheduled to a node that does not have the directory.
  # nodeAffinity:
  #   required:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #           - key: kubernetes.io/hostname
  #             operator: In
  #             values: ["your-node-name"]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: staug
spec:
  volumeName: redis-data-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: staug
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
